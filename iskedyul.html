<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/iskedyul.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Montserrat:wght@400;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<!-- iskedyul.html -->
<body>
      <header>
            <div class="container">
                <div class="logo">
                    <img src="images/logo_tambayan.png" alt="Jhoven's Tambayan Logo">
                    <h1>Jhoven's Tambayan</h1>
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                        <li><a href="#nba-stream-section"><i class="fas fa-basketball-ball"></i> NBA Live!</a></li>
                        <li><a href="iskedyul.html"  class="active" ></a><i class="fas fa-calendar-alt"></i> Iskedyul</a></li>
                        <li><a href="bilyaran.html"><i class="fas fa-gamepad-alt"></i> Bilyaran</a></li>
                        <li><a href="videokehan.html"><i class="fas fa-microphone-alt"></i> Videokehan</a></li>
                        <li><a href="pagkain.html"><i class="fas fa-utensils"></i> Pagkain</a></li>
                        <li><a href="pustahan.html"><i class="fas fa-dice"></i> Pustahan!</a></li>
                    </ul>
                </nav>
            </div>
        </header>
    <!-- ... (header) ... -->
    <main class="container page-content">
        <section class="schedule-section">
            <div class="schedule-header">
                <h2><i class="fas fa-calendar-days"></i> Iskedyul ng mga Bigating Bakbakan! <i class="fas fa-fire-alt"></i></h2>
                <p class="timezone-note"><i class="fas fa-clock"></i> Oras ay PHT (Philippine Tambayan Time)</p>
                <div class="schedule-filters">
                    <label for="dateRangeStart">Mula:</label>
                    <input type="date" id="dateRangeStart" class="date-filter">
                    <label for="dateRangeEnd">Hanggang:</label>
                    <input type="date" id="dateRangeEnd" class="date-filter">
                    <button id="filterDateRangeBtn" class="filter-btn neon-button-alt">Ipakita Iskedyul!</button>
                    <!-- <button class="filter-btn active" onclick="filterSchedule('all')">Lahat</button> -->
                    <!-- Add more filters later if needed -->
                </div>
            </div>

            <div class="schedule-grid" id="scheduleGrid">
                <!-- Initial Loading Message -->
                <div class="loading-message-iskedyul">
                    <p><i class="fas fa-spinner fa-spin"></i> Naglo-load ng iskedyul, mga Paps... Abang-abang lang!</p>
                </div>
                <!-- Game Day Panels and Game Items will be injected here by JS -->
            </div>
            
            <p class="tip"><i class="fas fa-info-circle"></i> <i>Schedule subject to change. Laging bumisita para updated!</i></p>
        </section>
    </main>
    <!-- ... (footer) ... -->
    <script src="js/global_scripts.js"></script>
    <script type="module" src="js/iskedyul_scripts.js"></script> <!-- IMPORTANT: type="module" -->
